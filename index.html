<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>포카 체크리스트</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  background: #f7f7f7;

  color: #222;

  font-family: Arial, sans-serif;

}

/* 상단 */

.header {

  background: white;

  padding: 22px 16px 16px;

  border-bottom: 1px solid #eee;

}

.header h1 {

  margin: 0 0 8px;

  font-size: 22px;

}

.progress {

  font-size: 13px;

  color: #888;

}

.progress b {

  color: #222;

}

/* 내용 */

.content {

  padding: 18px 12px 100px;

}

/* 처음 아무것도 없을 때 */

.empty {

  text-align: center;

  color: #aaa;

  padding: 90px 20px;

  font-size: 14px;

  line-height: 1.7;

}

/* 버전 */

.version {

  margin-bottom: 30px;

}

.version-title {

  margin: 0 4px 12px;

  font-size: 15px;

  font-weight: bold;

}

.version-count {

  margin-left: 5px;

  color: #aaa;

  font-size: 11px;

  font-weight: normal;

}

/* 포카 그리드 */

.card-grid {

  display: grid;

  grid-template-columns: repeat(5, 1fr);

  gap: 9px;

}

/* 포카 */

.card {

  position: relative;

  min-width: 0;

  cursor: pointer;

  user-select: none;

}

/* 사진 */

.card-image {

  width: 100%;

  aspect-ratio: 2 / 3;

  object-fit: cover;

  display: block;

  border-radius: 5px;

  background: #e9e9e9;

}

/* 사진이 없는 경우 */

.no-photo {

  width: 100%;

  aspect-ratio: 2 / 3;

  border-radius: 5px;

  background: #e9e9e9;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #aaa;

  font-size: 9px;

}

/* 미소장 */

.card:not(.owned) .card-image {

  filter: grayscale(100%);

  opacity: 0.35;

}

.card:not(.owned) .no-photo {

  opacity: 0.45;

}

/* 종류 */

.card-type {

  position: absolute;

  left: 4px;

  bottom: 22px;

  padding: 2px 4px;

  border-radius: 3px;

  background: rgba(0,0,0,0.72);

  color: white;

  font-size: 7px;

}

/* 이름 */

.card-name {

  margin-top: 5px;

  text-align: center;

  font-size: 9px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}

/* 추가 버튼 */

.add-button {

  position: fixed;

  right: 18px;

  bottom: 22px;

  z-index: 100;

  width: 56px;

  height: 56px;

  border: none;

  border-radius: 50%;

  background: #222;

  color: white;

  font-size: 30px;

  line-height: 56px;

  box-shadow: 0 5px 18px rgba(0,0,0,0.2);

}

/* 팝업 배경 */

.modal-bg {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 200;

  background: rgba(0,0,0,0.45);

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.modal-bg.show {

  display: flex;

}

/* 팝업 */

.modal {

  width: 100%;

  max-width: 380px;

  max-height: 90vh;

  overflow-y: auto;

  background: white;

  border-radius: 16px;

  padding: 20px;

}

.modal h2 {

  margin: 0 0 18px;

  font-size: 19px;

}

.input {

  width: 100%;

  height: 44px;

  border: 1px solid #ddd;

  border-radius: 8px;

  padding: 0 12px;

  margin-bottom: 10px;

  font-size: 14px;

  outline: none;

}

.input:focus {

  border-color: #888;

}

/* 사진 선택 */

.photo-label {

  display: block;

  width: 100%;

  padding: 13px;

  border: 1px dashed #bbb;

  border-radius: 8px;

  text-align: center;

  color: #777;

  font-size: 13px;

  margin-bottom: 12px;

}

/* 미리보기 */

#preview {

  width: 80px;

  height: 110px;

  object-fit: cover;

  border-radius: 6px;

  display: none;

  margin: 0 auto 14px;

}

/* 버튼 */

.modal-buttons {

  display: flex;

  gap: 8px;

}

.modal-buttons button {

  flex: 1;

  height: 44px;

  border: none;

  border-radius: 8px;

  font-size: 14px;

}

.cancel {

  background: #eee;

}

.save {

  background: #222;

  color: white;

}

/* 삭제 안내 */

.help {

  margin-top: 12px;

  text-align: center;

  font-size: 10px;

  color: #aaa;

}

/* 작은 화면 */

@media (max-width: 380px) {

  .card-grid {

    grid-template-columns: repeat(4, 1fr);

  }

}

</style>

</head>

<body>

<!-- 상단 -->

<header class="header">

  <h1>포카 체크리스트</h1>

  <div class="progress">

    <b id="ownedCount">0</b>

    /

    <span id="totalCount">0</span>

    장 소장

  </div>

</header>

<!-- 포카 목록 -->

<main class="content" id="content"></main>

<!-- 추가 버튼 -->

<button

  class="add-button"

  onclick="openModal()"

>

  +

</button>

<!-- 포카 추가 팝업 -->

<div

  class="modal-bg"

  id="modal"

>

  <div class="modal">

    <h2>포카 추가</h2>

    <input

      class="input"

      id="cardName"

      type="text"

      placeholder="포카 이름"

    >

    <input

      class="input"

      id="versionName"

      type="text"

      placeholder="버전 / 앨범명"

    >

    <input

      class="input"

      id="cardType"

      type="text"

      placeholder="종류 (예: album, event, 특전)"

    >

    <label class="photo-label">

      📷 포카 사진 선택

      <input

        id="photoInput"

        type="file"

        accept="image/*"

        hidden

        onchange="previewPhoto(event)"

      >

    </label>

    <img id="preview">

    <div class="modal-buttons">

      <button

        class="cancel"

        onclick="closeModal()"

      >

        취소

      </button>

      <button

        class="save"

        onclick="addCard()"

      >

        추가

      </button>

    </div>

    <div class="help">

      포카를 길게 누르면 삭제할 수 있어요.

    </div>

  </div>

</div>

<script>

/* ==================================================

   저장 공간

   이전 테스트 데이터와 다른 이름을 사용해서

   처음부터 빈 목록으로 시작함

================================================== */

const STORAGE_KEY = "my_photocard_checklist_v2";

let cards = JSON.parse(

  localStorage.getItem(STORAGE_KEY)

) || [];

let selectedImage = "";

/* ==================================================

   저장

================================================== */

function saveCards() {

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(cards)

  );

}

/* ==================================================

   화면 만들기

================================================== */

function render() {

  const content =

    document.getElementById("content");

  content.innerHTML = "";

  /* 포카가 하나도 없을 때 */

  if (cards.length === 0) {

    content.innerHTML = `

      <div class="empty">

        아직 등록한 포카가 없어.<br>

        오른쪽 아래 <b>+</b> 버튼을 눌러<br>

        네 포카를 추가해줘!

      </div>

    `;

    updateCount();

    return;

  }

  /* 버전별로 묶기 */

  const versions = {};

  cards.forEach(card => {

    if (!versions[card.version]) {

      versions[card.version] = [];

    }

    versions[card.version].push(card);

  });

  /* 버전 화면 만들기 */

  Object.keys(versions).forEach(version => {

    const versionCards =

      versions[version];

    const owned =

      versionCards.filter(

        card => card.owned

      ).length;

    const section =

      document.createElement("section");

    section.className = "version";

    section.innerHTML = `

      <div class="version-title">

        ${escapeHTML(version)}

        <span class="version-count">

          ${owned}/${versionCards.length}

        </span>

      </div>

      <div class="card-grid"></div>

    `;

    const grid =

      section.querySelector(".card-grid");

    /* 포카 하나씩 만들기 */

    versionCards.forEach(card => {

      const element =

        document.createElement("div");

      element.className =

        "card" +

        (card.owned ? " owned" : "");

      /* 사진 */

      let photoHTML;

      if (card.image) {

        photoHTML = `

          <img

            class="card-image"

            src="${card.image}"

            alt="${escapeHTML(card.name)}"

          >

        `;

      } else {

        photoHTML = `

          <div class="no-photo">

            PHOTO

          </div>

        `;

      }

      element.innerHTML = `

        ${photoHTML}

        <div class="card-type">

          ${escapeHTML(card.type || "포카")}

        </div>

        <div class="card-name">

          ${escapeHTML(card.name)}

        </div>

      `;

      /* 누르면 소장/미소장 */

      element.addEventListener(

        "click",

        function() {

          card.owned =

            !card.owned;

          saveCards();

          render();

        }

      );

      /* 길게 누르면 삭제 */

      let timer;

      element.addEventListener(

        "touchstart",

        function() {

          timer = setTimeout(

            function() {

              const answer =

                confirm(

                  `"${card.name}" 포카를 삭제할까?`

                );

              if (answer) {

                cards =

                  cards.filter(

                    item =>

                      item.id !== card.id

                  );

                saveCards();

                render();

              }

            },

            800

          );

        }

      );

      element.addEventListener(

        "touchend",

        function() {

          clearTimeout(timer);

        }

      );

      element.addEventListener(

        "touchmove",

        function() {

          clearTimeout(timer);

        }

      );

      grid.appendChild(element);

    });

    content.appendChild(section);

  });

  updateCount();

}

/* ==================================================

   전체 개수

================================================== */

function updateCount() {

  const owned =

    cards.filter(

      card => card.owned

    ).length;

  document.getElementById(

    "ownedCount"

  ).textContent = owned;

  document.getElementById(

    "totalCount"

  ).textContent = cards.length;

}

/* ==================================================

   팝업 열기

================================================== */

function openModal() {

  document

    .getElementById("modal")

    .classList.add("show");

}

/* ==================================================

   팝업 닫기

================================================== */

function closeModal() {

  document

    .getElementById("modal")

    .classList.remove("show");

  document.getElementById(

    "cardName"

  ).value = "";

  document.getElementById(

    "versionName"

  ).value = "";

  document.getElementById(

    "cardType"

  ).value = "";

  document.getElementById(

    "photoInput"

  ).value = "";

  document.getElementById(

    "preview"

  ).style.display = "none";

  selectedImage = "";

}

/* ==================================================

   사진 미리보기

================================================== */

function previewPhoto(event) {

  const file =

    event.target.files[0];

  if (!file) return;

  const reader =

    new FileReader();

  reader.onload =

    function(e) {

      selectedImage =

        e.target.result;

      const preview =

        document.getElementById(

          "preview"

        );

      preview.src =

        selectedImage;

      preview.style.display =

        "block";

    };

  reader.readAsDataURL(file);

}

/* ==================================================

   포카 추가

================================================== */

function addCard() {

  const name =

    document.getElementById(

      "cardName"

    ).value.trim();

  const version =

    document.getElementById(

      "versionName"

    ).value.trim();

  const type =

    document.getElementById(

      "cardType"

    ).value.trim();

  /* 이름 확인 */

  if (!name) {

    alert("포카 이름을 적어줘!");

    return;

  }

  /* 버전 확인 */

  if (!version) {

    alert("버전이나 앨범명을 적어줘!");

    return;

  }

  /* 새로운 포카 */

  const newCard = {

    id: Date.now(),

    name: name,

    version: version,

    type: type || "포카",

    image: selectedImage,

    owned: false

  };

  cards.push(newCard);

  saveCards();

  closeModal();

  render();

}

/* ==================================================

   HTML 문자 처리

================================================== */

function escapeHTML(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

/* ==================================================

   시작

================================================== */

render();

</script>

</body>

</html>
