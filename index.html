<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포카 체크리스트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      color: #222;
    }

    .header {
      padding: 25px 20px 15px;
      background: white;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 8px 0 0;
      color: #888;
      font-size: 14px;
    }

    .count {
      margin-top: 15px;
      padding: 12px 15px;
      background: #f1f1f1;
      border-radius: 12px;
      font-size: 14px;
    }

    .content {
      padding: 20px;
    }

    .category {
      margin-bottom: 30px;
    }

    .category-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 13px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
    }

    .card-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 10px;
      background: #d9d9d9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 13px;
      filter: grayscale(100%);
      transition: 0.2s;
    }

    .card.owned .card-image {
      background: linear-gradient(135deg, #ffd6e7, #d8e7ff);
      color: #555;
      filter: grayscale(0%);
    }

    .card-name {
      margin-top: 9px;
      font-size: 14px;
      font-weight: bold;
    }

    .card-status {
      margin-top: 4px;
      font-size: 12px;
      color: #999;
    }

    .card.owned .card-status {
      color: #777;
    }

    @media (min-width: 600px) {
      .cards {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>포카 체크리스트</h1>
    <p>내 포카를 한눈에 정리해보자</p>

    <div class="count">
      가지고 있는 포카 <b id="ownedCount">0</b>장 /
      전체 <b id="totalCount">0</b>장
    </div>
  </div>

  <div class="content" id="content"></div>

  <script>
    const categories = [
      {
        name: "앨범 포카",
        cards: ["앨범 포카 1", "앨범 포카 2", "앨범 포카 3", "앨범 포카 4"]
      },
      {
        name: "특전 포카",
        cards: ["특전 포카 1", "특전 포카 2", "특전 포카 3", "특전 포카 4"]
      },
      {
        name: "럭키 포카",
        cards: ["럭키 포카 1", "럭키 포카 2", "럭키 포카 3", "럭키 포카 4"]
      },
      {
        name: "기타 포카",
        cards: ["기타 포카 1", "기타 포카 2", "기타 포카 3", "기타 포카 4"]
      }
    ];

    const content = document.getElementById("content");

    let owned = JSON.parse(
      localStorage.getItem("ownedCards") || "[]"
    );

    function makeId(category, card) {
      return category + "-" + card;
    }

    function render() {
      content.innerHTML = "";

      let total = 0;

      categories.forEach(category => {
        const section = document.createElement("div");
        section.className = "category";

        const title = document.createElement("div");
        title.className = "category-title";
        title.textContent = category.name;

        const cards = document.createElement("div");
        cards.className = "cards";

        category.cards.forEach(cardName => {
          total++;

          const id = makeId(category.name, cardName);
          const isOwned = owned.includes(id);

          const card = document.createElement("div");
          card.className = "card" + (isOwned ? " owned" : "");

          card.innerHTML = `
            <div class="card-image">
              포카 사진
            </div>

            <div class="card-name">
              ${cardName}
            </div>

            <div class="card-status">
              ${isOwned ? "보유 중 ✓" : "미보유"}
            </div>
          `;

          card.addEventListener("click", () => {
            if (owned.includes(id)) {
              owned = owned.filter(item => item !== id);
            } else {
              owned.push(id);
            }

            localStorage.setItem(
              "ownedCards",
              JSON.stringify(owned)
            );

            render();
          });

          cards.appendChild(card);
        });

        section.appendChild(title);
        section.appendChild(cards);
        content.appendChild(section);
      });

      document.getElementById("ownedCount").textContent = owned.length;
      document.getElementById("totalCount").textContent = total;
    }

    render();
  </script>

</body>
</html>
