<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>포카 체크리스트</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #f8f8f8;

  color: #222;

}

/* 상단 */

.header {

  padding: 22px 18px 12px;

  background: white;

}

.header h1 {

  margin: 0;

  font-size: 24px;

}

.header p {

  margin: 7px 0 0;

  color: #888;

  font-size: 13px;

}

/* 보유 개수 */

.info {

  margin: 12px;

  padding: 13px;

  background: #eeeeee;

  border-radius: 10px;

  font-size: 14px;

}

/* 추가 버튼 */

.add-button {

  margin: 0 12px 20px;

  width: calc(100% - 24px);

  padding: 14px;

  border: 0;

  border-radius: 12px;

  background: #222;

  color: white;

  font-size: 16px;

  font-weight: bold;

}

/* 전체 영역 */

.section {

  padding: 0 12px 25px;

}

.version-section {

  margin-bottom: 28px;

}

/* 버전 제목 */

.version-title {

  font-size: 19px;

  font-weight: bold;

  margin: 0 0 12px;

  padding-bottom: 8px;

  border-bottom: 2px solid #222;

}

/* 포카 그리드 */

.grid {

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 12px;

}

/* 포카 카드 */

.card {

  background: white;

  border-radius: 12px;

  padding: 10px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.06);

  transition: 0.2s;

}

/* 미보유 포카 */

.card.not-owned {

  background: #e5e5e5;

  filter: grayscale(100%);

  opacity: 0.65;

}

/* 보유 포카 */

.card.owned {

  background: white;

  filter: none;

  opacity: 1;

}

/* 사진 */

.card img,

.no-image {

  width: 25%;

  aspect-ratio: 2 / 3;

  object-fit: cover;

  border-radius: 6px;

  background: #eeeeee;

  display: block;

  margin: 0 auto;

}

/* 사진이 없을 때 */

.no-image {

  display: flex;

  align-items: center;

  justify-content: center;

  color: #aaa;

  font-size: 10px;

  text-align: center;

}

/* 포카 이름 */

.card-name {

  margin: 8px 2px 5px;

  font-size: 14px;

  font-weight: bold;

  text-align: center;

}

/* 상태 */

.card-status {

  font-size: 12px;

  color: #999;

  text-align: center;

}

/* 버튼 */

.card button {

  margin-top: 7px;

  width: 100%;

  padding: 8px;

  border: 0;

  border-radius: 8px;

  background: #eeeeee;

}

/* 삭제 버튼 */

.card button.delete {

  background: #f3dddd;

  color: #a33;

}

/* 포카 없음 */

.empty {

  color: #aaa;

  font-size: 14px;

}

/* 모달 */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,0.45);

  align-items: center;

  justify-content: center;

  padding: 20px;

  z-index: 100;

}

/* 추가창 */

.modal-box {

  width: 100%;

  max-width: 420px;

  background: white;

  border-radius: 16px;

  padding: 20px;

}

.modal-box h2 {

  margin-top: 0;

}

/* 입력창 */

.modal-box input[type="text"] {

  width: 100%;

  padding: 12px;

  border: 1px solid #ddd;

  border-radius: 9px;

  margin-bottom: 12px;

  font-size: 15px;

}

/* 사진 선택 */

.file-label {

  display: block;

  padding: 12px;

  text-align: center;

  border: 1px dashed #bbb;

  border-radius: 9px;

  margin-bottom: 15px;

  color: #666;

}

/* 모달 버튼 */

.modal-buttons {

  display: flex;

  gap: 8px;

}

.modal-buttons button {

  flex: 1;

  padding: 12px;

  border: 0;

  border-radius: 9px;

}

.save-btn {

  background: #222;

  color: white;

}

.cancel-btn {

  background: #eee;

}

</style>

</head>

<body>

<!-- 상단 -->

<div class="header">

  <h1>포카 체크리스트</h1>

  <p>내 포카를 한눈에 정리해보자</p>

</div>

<!-- 보유 개수 -->

<div class="info" id="info">

  가지고 있는 포카 0장 / 전체 0장

</div>

<!-- 포카 추가 -->

<button class="add-button" onclick="openModal()">

  ＋ 포카 추가하기

</button>

<!-- 포카 목록 -->

<div class="section">

  <div id="cardList"></div>

</div>

<!-- 포카 추가 창 -->

<div class="modal" id="modal">

  <div class="modal-box">

    <h2>포카 추가</h2>

    <input

      type="text"

      id="versionName"

      placeholder="버전 이름 (예: 앨범 A ver.)"

    >

    <input

      type="text"

      id="cardName"

      placeholder="포카 이름 (예: 성호)"

    >

    <label class="file-label">

      📷 사진 선택하기

      <input

        type="file"

        id="cardImage"

        accept="image/*"

        style="display:none"

      >

    </label>

    <div class="modal-buttons">

      <button

        class="cancel-btn"

        onclick="closeModal()"

      >

        취소

      </button>

      <button

        class="save-btn"

        onclick="addCard()"

      >

        추가하기

      </button>

    </div>

  </div>

</div>

<script>

/* 저장된 포카 불러오기 */

let cards = JSON.parse(

  localStorage.getItem("photocardList")

) || [];

/* 버전 정보가 없는 기존 포카 처리 */

cards = cards.map(card => {

  if (!card.version) {

    card.version = "버전 미지정";

  }

  return card;

});

/* 저장 */

function saveCards() {

  localStorage.setItem(

    "photocardList",

    JSON.stringify(cards)

  );

}

/* 추가창 열기 */

function openModal() {

  document.getElementById("modal").style.display = "flex";

  document.getElementById("versionName").value = "";

  document.getElementById("cardName").value = "";

  document.getElementById("cardImage").value = "";

}

/* 추가창 닫기 */

function closeModal() {

  document.getElementById("modal").style.display = "none";

}

/* 포카 추가 */

function addCard() {

  const version =

    document.getElementById("versionName")

      .value.trim();

  const name =

    document.getElementById("cardName")

      .value.trim();

  const imageInput =

    document.getElementById("cardImage");

  if (!version) {

    alert("버전 이름을 적어줘!");

    return;

  }

  if (!name) {

    alert("포카 이름을 적어줘!");

    return;

  }

  /* 사진이 있는 경우 */

  if (imageInput.files.length > 0) {

    const file = imageInput.files[0];

    const reader = new FileReader();

    reader.onload = function(e) {

      cards.push({

        id: Date.now(),

        version: version,

        name: name,

        image: e.target.result,

        owned: false

      });

      saveCards();

      renderCards();

      closeModal();

    };

    reader.readAsDataURL(file);

  } else {

    /* 사진이 없는 경우 */

    cards.push({

      id: Date.now(),

      version: version,

      name: name,

      image: "",

      owned: false

    });

    saveCards();

    renderCards();

    closeModal();

  }

}

/* 보유 / 미보유 변경 */

function toggleOwned(id) {

  const card = cards.find(

    c => c.id === id

  );

  if (card) {

    card.owned = !card.owned;

    saveCards();

    renderCards();

  }

}

/* 포카 삭제 */

function deleteCard(id) {

  if (!confirm("이 포카를 삭제할까?")) {

    return;

  }

  cards = cards.filter(

    c => c.id !== id

  );

  saveCards();

  renderCards();

}

/* 포카 화면 표시 */

function renderCards() {

  const list =

    document.getElementById("cardList");

  list.innerHTML = "";

  /* 보유 개수 */

  const ownedCount =

    cards.filter(c => c.owned).length;

  document.getElementById("info").innerText =

    `가지고 있는 포카 ${ownedCount}장 / 전체 ${cards.length}장`;

  /* 포카가 없을 때 */

  if (cards.length === 0) {

    list.innerHTML =

      `<p class="empty">아직 추가한 포카가 없어!</p>`;

    return;

  }

  /* 버전별로 묶기 */

  const grouped = {};

  cards.forEach(card => {

    const version =

      card.version || "버전 미지정";

    if (!grouped[version]) {

      grouped[version] = [];

    }

    grouped[version].push(card);

  });

  /* 버전별 표시 */

  Object.keys(grouped).forEach(version => {

    const section =

      document.createElement("div");

    section.className =

      "version-section";

    /* 버전 제목 */

    const title =

      document.createElement("div");

    title.className =

      "version-title";

    title.textContent =

      version;

    /* 포카 그리드 */

    const grid =

      document.createElement("div");

    grid.className =

      "grid";

    grouped[version].forEach(card => {

      const div =

        document.createElement("div");

      /* 보유 여부에 따라 색깔 변경 */

      div.className =

        card.owned

          ? "card owned"

          : "card not-owned";

      /* 사진 */

      let imageHTML = card.image

        ? `<img src="${card.image}" alt="${escapeHTML(card.name)}">`

        : `<div class="no-image">사진 없음</div>`;

      div.innerHTML = `

        ${imageHTML}

        <div class="card-name">

          ${escapeHTML(card.name)}

        </div>

        <div class="card-status">

          ${card.owned ? "✓ 보유" : "미보유"}

        </div>

        <button

          onclick="toggleOwned(${card.id})"

        >

          ${card.owned

            ? "미보유로 변경"

            : "보유로 체크"}

        </button>

        <button

          class="delete"

          onclick="deleteCard(${card.id})"

        >

          삭제

        </button>

      `;

      grid.appendChild(div);

    });

    section.appendChild(title);

    section.appendChild(grid);

    list.appendChild(section);

  });

}

/* HTML 문자 안전하게 표시 */

function escapeHTML(text) {

  const div =

    document.createElement("div");

  div.textContent =

    text;

  return div.innerHTML;

}

/* 처음 실행 */

renderCards();

</script>

</body>

</html>
