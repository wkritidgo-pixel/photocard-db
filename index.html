<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>포카 체크리스트</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #f8f8f8;

  color: #222;

}

.header {

  padding: 22px 18px 12px;

  background: white;

}

.header h1 {

  margin: 0;

  font-size: 24px;

}

.header p {

  margin: 7px 0 0;

  color: #888;

  font-size: 13px;

}

.info {

  margin: 12px;

  padding: 13px;

  background: #eeeeee;

  border-radius: 10px;

  font-size: 14px;

}

.add-button {

  margin: 0 12px 20px;

  width: calc(100% - 24px);

  padding: 14px;

  border: 0;

  border-radius: 12px;

  background: #222;

  color: white;

  font-size: 16px;

  font-weight: bold;

}

.section {

  padding: 0 12px 25px;

}

.section h2 {

  font-size: 18px;

  margin: 10px 0;

}

.grid {

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 12px;

}

.card {

  background: white;

  border-radius: 12px;

  padding: 8px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.06);

}

.card img,

.no-image {

  width: 100%;

  aspect-ratio: 2 / 3;

  object-fit: cover;

  border-radius: 8px;

  background: #eeeeee;

}

.no-image {

  display: flex;

  align-items: center;

  justify-content: center;

  color: #aaa;

  font-size: 13px;

}

.card-name {

  margin: 8px 2px 5px;

  font-size: 14px;

  font-weight: bold;

}

.card-status {

  font-size: 12px;

  color: #999;

}

.card button {

  margin-top: 7px;

  width: 100%;

  padding: 8px;

  border: 0;

  border-radius: 8px;

  background: #eeeeee;

}

.card button.delete {

  background: #f3dddd;

  color: #a33;

}

.modal {

  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,0.45);

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.modal-box {

  width: 100%;

  max-width: 420px;

  background: white;

  border-radius: 16px;

  padding: 20px;

}

.modal-box h2 {

  margin-top: 0;

}

.modal-box input[type="text"] {

  width: 100%;

  padding: 12px;

  border: 1px solid #ddd;

  border-radius: 9px;

  margin-bottom: 12px;

  font-size: 15px;

}

.file-label {
