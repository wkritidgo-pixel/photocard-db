<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>포카 체크리스트</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  background: #f7f7f7;

  color: #222;

  font-family: Arial, sans-serif;

}

/* 상단 */

.header {

  position: sticky;

  top: 0;

  z-index: 100;

  background: white;

  padding: 18px 16px 14px;

  border-bottom: 1px solid #eee;

}

.header h1 {

  margin: 0 0 8px;

  font-size: 22px;

}

.progress {

  font-size: 13px;

  color: #777;

}

.progress b {

  color: #222;

}

/* 추가 버튼 */

.add-button {

  position: fixed;

  right: 18px;

  bottom: 22px;

  z-index: 200;

  width: 55px;

  height: 55px;

  border: none;

  border-radius: 50%;

  background: #222;

  color: white;

  font-size: 30px;

  box-shadow: 0 5px 18px rgba(0,0,0,.2);

}

/* 내용 */

.content {

  padding: 18px 12px 100px;

}

/* 버전 */

.version {

  margin-bottom: 28px;

}

.version-title {

  font-size: 15px;

  font-weight: bold;

  margin: 0 4px 11px;

}

.version-count {

  color: #999;

  font-size: 11px;

  font-weight: normal;

  margin-left: 5px;

}

/* 포카 그리드 */

.card-grid {

  display: grid;

  grid-template-columns: repeat(5, 1fr);

  gap: 8px;

}

/* 포카 */

.card {

  position: relative;

  cursor: pointer;

}

.card-image {

  width: 100%;

  aspect-ratio: 2 / 3;

  object-fit: cover;

  display: block;

  border-radius: 5px;

  background: #ddd;

  transition: .2s;

}

/* 미소장 */

.card:not(.owned) .card-image {

  filter: grayscale(100%);

  opacity: .38;

}

/* 소장 */

.card.owned .card-image {

  filter: none;

  opacity: 1;

}

/* 종류 */

.card-type {

  position: absolute;

  left: 4px;

  bottom: 4px;

  padding: 2px 4px;

  border-radius: 3px;

  background: rgba(0,0,0,.75);

  color: white;

  font-size: 7px;

}

/* 이름 */

.card-name {

  margin-top: 4px;

  text-align: center;

  font-size: 9px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}

/* 빈 화면 */

.empty {

  text-align: center;

  color: #aaa;

  padding: 80px 20px;

  font-size: 14px;

}

/* 팝업 */

.modal-bg {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 300;

  background: rgba(0,0,0,.45);

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.modal-bg.show {

  display: flex;

}

.modal {

  width: 100%;

  max-width: 380px;

  background: white;

  border-radius: 16px;

  padding: 20px;

}

.modal h2 {

  margin: 0 0 18px;

  font-size: 19px;

}

.input {

  width: 100%;

  height: 44px;

  border: 1px solid #ddd;

  border-radius: 8px;

  padding: 0 12px;

  margin-bottom: 10px;

  font-size: 14px;

  outline: none;

}

.input:focus {

  border-color: #888;

}

.photo-label {

  display: block;

  width: 100%;

  padding: 12px;

  border: 1px dashed #bbb;

  border-radius: 8px;

  text-align: center;

  color: #777;

  font-size: 13px;

  margin-bottom: 14px;

}

#preview {

  width: 80px;

  height: 110px;

  object-fit: cover;

  border-radius: 6px;

  display: none;

  margin: 0 auto 14px;

}

.modal-buttons {

  display: flex;

  gap: 8px;

}

.modal-buttons button {

  flex: 1;

  height: 44px;

  border: none;

  border-radius: 8px;

  font-size: 14px;

}

.cancel {

  background: #eee;

}

.save {

  background: #222;

  color: white;

}

/* 삭제 버튼 */

.delete-button {

  width: 100%;

  height: 38px;

  margin-top: 10px;

  border: none;

  border-radius: 8px;

  background: #f1f1f1;

  color: #777;

}

/* 작은 화면 */

@media (max-width: 350px) {

  .card-grid {

    grid-template-columns: repeat(4, 1fr);

  }

}

</style>

</head>

<body>

<header class="header">

  <h1>포카 체크리스트</h1>

  <div class="progress">

    <b id="ownedCount">0</b>

    /

    <span id="totalCount">0</span>

    장 소장

  </div>

</header>

<main class="content" id="content">

</main>

<button class="add-button" onclick="openModal()">+</button>

<!-- 포카 추가 팝업 -->

<div class="modal-bg" id="modal">

  <div class="modal">

    <h2>포카 추가</h2>

    <input

      class="input"

      id="cardName"

      type="text"

      placeholder="포카 이름"

    >

    <input

      class="input"

      id="versionName"

      type="text"

      placeholder="버전 / 앨범명"

    >

    <input

      class="input"

      id="cardType"

      type="text"

      placeholder="종류 (예: album, event, 특전)"

    >

    <label class="photo-label">

      📷 포카 사진 선택

      <input

        id="photoInput"

        type="file"

        accept="image/*"

        hidden

        onchange="previewPhoto(event)"

      >

    </label>

    <img id="preview">

    <div class="modal-buttons">

      <button class="cancel" onclick="closeModal()">

        취소

      </button>

      <button class="save" onclick="addCard()">

        추가

      </button>

    </div>

  </div>

</div>

<script>

/* =========================

   기본 데이터

========================= */

let cards = JSON.parse(

  localStorage.getItem("photocardCards")

) || [

  {

    id: 1,

    name: "포카 01",

    version: "앨범 1집",

    type: "album",

    image: "",

    owned: true

  },

  {

    id: 2,

    name: "포카 02",

    version: "앨범 1집",

    type: "album",

    image: "",

    owned: false

  },

  {

    id: 3,

    name: "포카 03",

    version: "앨범 1집",

    type: "event",

    image: "",

    owned: false

  }

];

/* =========================

   저장

========================= */

function saveCards() {

  localStorage.setItem(

    "photocardCards",

    JSON.stringify(cards)

  );

}

/* =========================

   화면 표시

========================= */

function render() {

  const content =

    document.getElementById("content");

  content.innerHTML = "";

  if (cards.length === 0) {

    content.innerHTML = `

      <div class="empty">

        아직 등록된 포카가 없어.<br>

        오른쪽 아래 + 버튼으로 추가해줘!

      </div>

    `;

    updateCount();

    return;

  }

  /* 버전별로 묶기 */

  const versions = {};

  cards.forEach(card => {

    if (!versions[card.version]) {

      versions[card.version] = [];

    }

    versions[card.version].push(card);

  });

  Object.keys(versions).forEach(version => {

    const section =

      document.createElement("section");

    section.className = "version";

    const owned =

      versions[version]

      .filter(card => card.owned)

      .length;

    section.innerHTML = `

      <div class="version-title">

        ${escapeHTML(version)}

        <span class="version-count">

          ${owned}/${versions[version].length}

        </span>

      </div>

      <div class="card-grid"></div>

    `;

    const grid =

      section.querySelector(".card-grid");

    versions[version].forEach(card => {

      const element =

        document.createElement("div");

      element.className =

        "card " + (card.owned ? "owned" : "");

      let imageHTML;

      if (card.image) {

        imageHTML = `

          <img

            class="card-image"

            src="${card.image}"

          >

        `;

      } else {

        imageHTML = `

          <div

            class="card-image"

            style="

              display:flex;

              align-items:center;

              justify-content:center;

              font-size:10px;

              color:#aaa;

            "

          >

            PHOTO

          </div>

        `;

      }

      element.innerHTML = `

        ${imageHTML}

        <div class="card-type">

          ${escapeHTML(card.type || "포카")}

        </div>

        <div class="card-name">

          ${escapeHTML(card.name)}

        </div>

      `;

      /* 클릭하면 소장 여부 변경 */

      element.onclick = () => {

        card.owned = !card.owned;

        saveCards();

        render();

      };

      /* 길게 누르면 삭제 */

      let pressTimer;

      element.addEventListener(

        "touchstart",

        () => {

          pressTimer = setTimeout(() => {

            if (

              confirm(

                `"${card.name}" 포카를 삭제할까?`

              )

            ) {

              cards =

                cards.filter(

                  c => c.id !== card.id

                );

              saveCards();

              render();

            }

          }, 800);

        }

      );

      element.addEventListener(

        "touchend",

        () => {

          clearTimeout(pressTimer);

        }

      );

      grid.appendChild(element);

    });

    content.appendChild(section);

  });

  updateCount();

}

/* =========================

   소장 개수

========================= */

function updateCount() {

  const owned =

    cards.filter(card => card.owned).length;

  document.getElementById(

    "ownedCount"

  ).textContent = owned;

  document.getElementById(

    "totalCount"

  ).textContent = cards.length;

}

/* =========================

   팝업 열기

========================= */

function openModal() {

  document

    .getElementById("modal")

    .classList.add("show");

}

/* =========================

   팝업 닫기

========================= */

function closeModal() {

  document

    .getElementById("modal")

    .classList.remove("show");

  document.getElementById(

    "cardName"

  ).value = "";

  document.getElementById(

    "versionName"

  ).value = "";

  document.getElementById(

    "cardType"

  ).value = "";

  document.getElementById(

    "photoInput"

  ).value = "";

  document.getElementById(

    "preview"

  ).style.display = "none";

}

/* =========================

   사진 미리보기

========================= */

let selectedImage = "";

function previewPhoto(event) {

  const file =

    event.target.files[0];

  if (!file) return;

  const reader =

    new FileReader();

  reader.onload = function(e) {

    selectedImage =

      e.target.result;

    const preview =

      document.getElementById("preview");

    preview.src =

      selectedImage;

    preview.style.display =

      "block";

  };

  reader.readAsDataURL(file);

}

/* =========================

   포카 추가

========================= */

function addCard() {

  const name =

    document.getElementById(

      "cardName"

    ).value.trim();

  const version =

    document.getElementById(

      "versionName"

    ).value.trim();

  const type =

    document.getElementById(

      "cardType"

    ).value.trim();

  if (!name) {

    alert("포카 이름을 적어줘!");

    return;

  }

  if (!version) {

    alert("버전이나 앨범명을 적어줘!");

    return;

  }

  cards.push({

    id: Date.now(),

    name: name,

    version: version,

    type: type || "포카",

    image: selectedImage,

    owned: false

  });

  saveCards();

  selectedImage = "";

  closeModal();

  render();

}

/* =========================

   HTML 문자 안전 처리

========================= */

function escapeHTML(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

/* =========================

   시작

========================= */

render();

</script>

</body>

</html>
